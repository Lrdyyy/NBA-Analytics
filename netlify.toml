[build]
  publish = "."

# Data files change daily; always revalidate. Service worker must never be cached stale.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-S707GTlaIRtjvjdONuGoeCsejRNZ2hVDKPCbxPZNeCs=' 'sha256-7J2MK0gfPlCmzLVM0XdMUwsKFjlvYmMrSVJGaNRJ70Y=' 'sha256-HXuUdiN4HSfRs0T777T5rIDAQ/MYjxBE8QQjkkbPD+g=' 'sha256-BYgK+D0BjX2LuDp5woZnBwSUZpyOqkXut/quJ5HQAXs='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
